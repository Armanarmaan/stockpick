name: IHSG Daily Screener Bot

on:
  schedule:
    # Berjalan Senin-Jumat jam 13:13 UTC (Sama dengan jam 19:00 WIB)
    - cron: '13 13 * * 1-5'
  workflow_dispatch: # Memungkinkan kamu menjalankan bot secara manual kapan saja dari web GitHub

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
